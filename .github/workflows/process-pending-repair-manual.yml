name: Process Pending Repair (Manual)

on:
  workflow_dispatch:
    inputs:
      target_items:
        description: "Target items to attempt in this run"
        required: true
        default: "1000"
      batch_size:
        description: "Items per batch"
        required: true
        default: "30"
      chunk_size:
        description: "MiniMax chunk size inside each batch"
        required: true
        default: "6"
      max_minutes:
        description: "Safety max runtime minutes"
        required: true
        default: "300"
      cooldown_base_seconds:
        description: "Cooldown base seconds for failed items"
        required: true
        default: "900"
      enable_per_item_fallback:
        description: "Fallback single-item request when batch item fails (higher request count)"
        required: true
        default: "false"
      candidate_multiplier:
        description: "Candidate pool multiplier for each batch"
        required: true
        default: "6"
      minimax_request_timeout_ms:
        description: "MiniMax request timeout in milliseconds"
        required: true
        default: "75000"

permissions:
  contents: read

concurrency:
  group: llm-enrichment-jobs
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Calculate limits
        id: limits
        env:
          TARGET_ITEMS: ${{ inputs.target_items }}
          BATCH_SIZE: ${{ inputs.batch_size }}
        run: |
          set -euo pipefail
          TARGET=$(printf "%d" "${TARGET_ITEMS}")
          BATCH=$(printf "%d" "${BATCH_SIZE}")
          if [ "$TARGET" -le 0 ] || [ "$BATCH" -le 0 ]; then
            echo "target_items and batch_size must be > 0"
            exit 1
          fi
          MAX_BATCHES=$(( (TARGET + BATCH - 1) / BATCH ))
          echo "max_batches=$MAX_BATCHES" >> "$GITHUB_OUTPUT"
          echo "target_items=$TARGET" >> "$GITHUB_OUTPUT"
          echo "batch_size=$BATCH" >> "$GITHUB_OUTPUT"

      - name: Count Pending (Before)
        id: before
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          BEFORE=$(node <<'NODE'
          const { Client } = require('pg');
          const client = new Client({ connectionString: process.env.DATABASE_URL, connectionTimeoutMillis: 10000 });
          (async () => {
            await client.connect();
            const r = await client.query('select count(*)::int as cnt from "Signal" where "aiSummary" is null');
            await client.end();
            process.stdout.write(String(r.rows[0].cnt));
          })().catch(async () => { try { await client.end(); } catch {} process.exit(1); });
          NODE
          )
          echo "pending_before=$BEFORE" >> "$GITHUB_OUTPUT"

      - name: Run Manual Repair
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LLM_PROVIDER: minimax
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.MINIMAX_MODEL || 'MiniMax-M2.5' }}
          BACKFILL_BATCH_SIZE: ${{ steps.limits.outputs.batch_size }}
          BACKFILL_MAX_BATCHES: ${{ steps.limits.outputs.max_batches }}
          BACKFILL_MAX_MINUTES: ${{ inputs.max_minutes }}
          BACKFILL_CHUNK_SIZE: ${{ inputs.chunk_size }}
          BACKFILL_COOLDOWN_BASE_SECONDS: ${{ inputs.cooldown_base_seconds }}
          BACKFILL_ENABLE_PER_ITEM_FALLBACK: ${{ inputs.enable_per_item_fallback }}
          BACKFILL_ENABLE_FAILURE_COOLDOWN: "true"
          BACKFILL_CANDIDATE_MULTIPLIER: ${{ inputs.candidate_multiplier }}
          MINIMAX_REQUEST_TIMEOUT_MS: ${{ inputs.minimax_request_timeout_ms }}
        run: |
          set -euo pipefail
          npx tsx scripts/trigger-processor.ts | tee repair.log

      - name: Count Pending (After)
        id: after
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          AFTER=$(node <<'NODE'
          const { Client } = require('pg');
          const client = new Client({ connectionString: process.env.DATABASE_URL, connectionTimeoutMillis: 10000 });
          (async () => {
            await client.connect();
            const r = await client.query('select count(*)::int as cnt from "Signal" where "aiSummary" is null');
            await client.end();
            process.stdout.write(String(r.rows[0].cnt));
          })().catch(async () => { try { await client.end(); } catch {} process.exit(1); });
          NODE
          )
          echo "pending_after=$AFTER" >> "$GITHUB_OUTPUT"

      - name: Publish summary
        if: always()
        env:
          TARGET_ITEMS: ${{ steps.limits.outputs.target_items }}
          BATCH_SIZE: ${{ steps.limits.outputs.batch_size }}
          MAX_BATCHES: ${{ steps.limits.outputs.max_batches }}
          CHUNK_SIZE: ${{ inputs.chunk_size }}
          MAX_MINUTES: ${{ inputs.max_minutes }}
          COOLDOWN_BASE_SECONDS: ${{ inputs.cooldown_base_seconds }}
          ENABLE_PER_ITEM_FALLBACK: ${{ inputs.enable_per_item_fallback }}
          CANDIDATE_MULTIPLIER: ${{ inputs.candidate_multiplier }}
          MINIMAX_REQUEST_TIMEOUT_MS: ${{ inputs.minimax_request_timeout_ms }}
        run: |
          set -euo pipefail
          BEFORE=${{ steps.before.outputs.pending_before }}
          AFTER=${{ steps.after.outputs.pending_after }}
          DELTA=$((BEFORE - AFTER))

          echo "## Process Pending Repair (Manual)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Pending Before: $BEFORE" >> "$GITHUB_STEP_SUMMARY"
          echo "- Pending After: $AFTER" >> "$GITHUB_STEP_SUMMARY"
          echo "- Reduced: $DELTA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target Items: ${TARGET_ITEMS}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Batch Size: ${BATCH_SIZE}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Max Batches: ${MAX_BATCHES}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Chunk Size: ${CHUNK_SIZE}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Max Minutes: ${MAX_MINUTES}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Cooldown Base Seconds: ${COOLDOWN_BASE_SECONDS}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Enable Per-Item Fallback: ${ENABLE_PER_ITEM_FALLBACK}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Candidate Multiplier: ${CANDIDATE_MULTIPLIER}" >> "$GITHUB_STEP_SUMMARY"
          echo "- MiniMax Timeout Ms: ${MINIMAX_REQUEST_TIMEOUT_MS}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Log Tail" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`text" >> "$GITHUB_STEP_SUMMARY"
          tail -n 120 repair.log >> "$GITHUB_STEP_SUMMARY" || true
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
